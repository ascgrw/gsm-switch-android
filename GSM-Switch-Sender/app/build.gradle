plugins { id 'com.android.application' }
android {
    namespace 'com.shahid.gsmcontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shahid.gsmcontrol.sender'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
