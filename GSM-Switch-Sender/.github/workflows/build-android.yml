name: Build Android SMS sender
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test command protocol
        run: |
          mkdir -p build/protocol-tests
          javac -d build/protocol-tests app/src/main/java/com/shahid/gsmcontrol/Protocol.java tests/ProtocolTest.java
          java -cp build/protocol-tests com.shahid.gsmcontrol.ProtocolTest
      - name: Build installable debug APK
        run: |
          gradle --no-daemon assembleDebug lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk GSM-Switch-Sender.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GSM-Switch-Sender-APK
          path: GSM-Switch-Sender.apk
          if-no-files-found: error
